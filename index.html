<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A district ledger of citizen reports in India, sealed on Arkiv so that nobody, including us, can delete a row." />
    <meta name="theme-color" content="#f5f5f2" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ff3b1f'/%3E%3C/svg%3E" />
    <script>
      // Apply a saved theme before the first paint, so there is no flash.
      try {
        var t = localStorage.getItem("utt:theme")
        if (t === "dark" || t === "light") {
          document.documentElement.dataset.theme = t
          document.querySelector("meta[name=theme-color]").setAttribute("content", t === "dark" ? "#0e0e0d" : "#f5f5f2")
        }
      } catch (e) {}
    </script>
    <title>Under the Table</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
